name: payment-transaction-platform
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: txn_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn_app -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  app1: &transaction-app
    build:
      context: ./production-multinode
      dockerfile: Dockerfile
    environment: &transaction-app-env
      APP_ENV: ${APP_ENV:-development}
      DB_URL: jdbc:postgresql://postgres:5432/transactions?sslmode=disable
      DB_USER: txn_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?Set API_BEARER_TOKEN in .env}
      OPS_BEARER_TOKEN: ${OPS_BEARER_TOKEN:?Set OPS_BEARER_TOKEN in .env}
      UI_ALLOWED_ORIGIN: ${UI_ALLOWED_ORIGIN:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      MAX_RETRIES: ${MAX_RETRIES:-5}
      HTTP_THREADS: ${HTTP_THREADS:-16}
      ENABLE_TEST_FAULT_INJECTION: ${ENABLE_TEST_FAULT_INJECTION:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  app2:
    <<: *transaction-app
    environment: *transaction-app-env
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

volumes:
  postgres-data:
networks:
  backend:
    driver: bridge
