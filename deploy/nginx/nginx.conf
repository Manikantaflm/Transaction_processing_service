worker_processes auto;
events { worker_connections 1024; }
http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  # Protect the API from accidental request floods. Tune this limit from real workload measurements.
  limit_req_zone $binary_remote_addr zone=transaction_api:10m rate=20r/s;
  limit_req_status 429;
  upstream transaction_nodes {
    least_conn;
    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /v1/ {
      limit_req zone=transaction_api burst=40 nodelay;
      proxy_pass http://transaction_nodes;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }
    location / {
      proxy_pass http://transaction_nodes;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }
  }
}
